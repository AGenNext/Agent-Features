# CRD for the Feature resource. Normally generated by `make manifests`
# (controller-gen); committed by hand so the platform can be applied without
# the toolchain. Keep in sync with api/v1alpha1/feature_types.go.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: features.agentfeatures.io
spec:
  group: agentfeatures.io
  names:
    kind: Feature
    listKind: FeatureList
    plural: features
    singular: feature
    shortNames:
      - feat
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                description:
                  type: string
                image:
                  type: string
                  minLength: 1
                protocol:
                  type: string
                  enum: [grpc, http]
                  default: grpc
                port:
                  type: integer
                  format: int32
                  default: 9090
                tags:
                  type: array
                  items:
                    type: string
                visibility:
                  type: string
                  enum: [Public, Internal, Private]
                  default: Public
                capability:
                  type: string
                vendor:
                  type: string
                  default: community
                trust:
                  type: string
                  enum: [Official, Verified, Community]
                  default: Community
                inputSchema:
                  type: string
                outputSchema:
                  type: string
                runtime:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                      format: int32
                      default: 1
                    maxReplicas:
                      type: integer
                      format: int32
                      default: 3
                    accelerator:
                      type: string
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Failed]
                endpoint:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true

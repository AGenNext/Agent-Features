# Gateway workload for cluster mode: it reads Feature CRs (RBAC below) and
# invokes feature workloads over gRPC. Exposed via NodePort for the kind demo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-features-gateway
  namespace: agent-features-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-features-gateway-read
rules:
  - apiGroups: ["agentfeatures.io"]
    resources: ["features"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-features-gateway-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-features-gateway-read
subjects:
  - kind: ServiceAccount
    name: agent-features-gateway
    namespace: agent-features-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-features-gateway
  namespace: agent-features-system
  labels: { app.kubernetes.io/name: gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway }
    spec:
      serviceAccountName: agent-features-gateway
      containers:
        - name: gateway
          image: ghcr.io/agennext/agent-features-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: AGENT_FEATURES_MODE, value: cluster }
            - { name: FEATURES_NAMESPACE, value: features }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-features-gateway
  namespace: agent-features-system
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: gateway }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

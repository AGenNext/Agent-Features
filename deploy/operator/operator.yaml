# Operator workload + RBAC binding. The ClusterRole itself lives in
# operator/config/rbac/role.yaml (applied by the e2e script).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-features-operator
  namespace: agent-features-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-features-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-features-operator-role
subjects:
  - kind: ServiceAccount
    name: agent-features-operator
    namespace: agent-features-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-features-operator
  namespace: agent-features-system
  labels: { app.kubernetes.io/name: operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: operator }
    spec:
      serviceAccountName: agent-features-operator
      containers:
        - name: manager
          image: ghcr.io/agennext/agent-features-operator:dev
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect"]

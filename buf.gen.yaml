# Code generation from proto/agentfeatures/v1/feature.proto.
# Run: buf generate
# Produces Python stubs (for features + gateway) and Go stubs (for the operator
# / future gRPC clients). The contract is the source of truth; these are built.
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/python
    out: gen/python
  - remote: buf.build/grpc/python
    out: gen/python
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative

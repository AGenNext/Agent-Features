# An "agent compose" file — assemble an agent from registry capabilities,
# the way a docker-compose file assembles services from Docker Hub images.
#
# Registry analogy:
#   Docker Hub image:tag   ->  capability + version   (resolved & ranked)
#   docker-compose service ->  a pipeline step
#   docker push            ->  POST /compose          (publish this composite)
#   docker run             ->  POST /composites/{name}/invoke
#
# Publish & run:
#   python - <<'PY'
#   import json, yaml, urllib.request
#   spec = yaml.safe_load(open("examples/agents/greet-report.agent.yaml"))
#   urllib.request.urlopen(urllib.request.Request(
#       "http://127.0.0.1:8000/compose",
#       data=json.dumps(spec).encode(), headers={"content-type":"application/json"}))
#   PY
#   curl -X POST localhost:8000/composites/greet-report/invoke \
#     -H 'content-type: application/json' -d '{"input":{"name":"Ada"}}'

name: greet-report
description: Greet someone, then report stats on the greeting.

input_schema:
  type: object
  properties:
    name: { type: string }
  required: [name]

steps:
  # Each step pulls a capability from the marketplace. Omit vendor/version to
  # let ranking pick the best provider; pin them like an image digest.
  - name: greeting
    capability: greet           # vendor/version optional -> best-ranked provider
    inputs:
      name: input.name          # reference DSL: <step|input>.<field>

  - name: stats
    capability: text_stats
    inputs:
      text: greeting.greeting   # pipe step 1's output into step 2

output:
  greeting: greeting.greeting
  characters: stats.characters
  words: stats.words

# OpenTelemetry Collector configuration for the platform.
# The gateway and feature workloads export OTLP here; the collector batches and
# fans out to Prometheus (metrics) and a tracing backend (traces).
#
# Used by the otel-collector Helm release (see infra/opentofu/platform.tf):
#   helm ... --set-file config=observability/otel-collector.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Tag every span/metric with the platform so dashboards can scope to it.
  resource:
    attributes:
      - key: platform
        value: agent-features
        action: upsert

exporters:
  # Prometheus scrapes the collector for RED metrics per feature.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Point this at your tracing backend (Tempo/Jaeger/OTLP endpoint).
  otlp/traces:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/traces, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
